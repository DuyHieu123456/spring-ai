<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 fw-bold text-primary">Tạo tài khoản mới</h3>

                    <!-- Thông báo lỗi (nếu trùng username hoặc lỗi xử lý) -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        Tên đăng nhập đã tồn tại!
                    </div>

                    <!-- Form Đăng ký -->
                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và tên:</label>
                            <input type="text" th:field="*{fullName}" id="fullName" class="form-control" placeholder="Nhập họ và tên" required autofocus />
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="example@domain.com" required />
                        </div>

                        <!-- Tên đăng nhập -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập:</label>
                            <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required />
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu:</label>
                            <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Nhập mật khẩu" required />
                        </div>

                        <!-- Tự động phân quyền ngầm (Mặc định là ROLE_CUSTOMER hoặc USER tùy bài) -->
                        <input type="hidden" th:field="*{role}" value="ROLE_CUSTOMER" />

                        <!-- Nút Đăng ký -->
                        <button type="submit" class="w-100 btn btn-primary py-2 font-weight-bold">Đăng ký ngay</button>
                    </form>

                    <hr class="my-4" />

                    <!-- Thắt nút chuyển sang Đăng nhập -->
                    <div class="text-center">
                        <span class="text-muted">Đã có tài khoản?</span>
                        <a th:href="@{/login}" class="text-decoration-none font-weight-bold ms-1">Đăng nhập ngay</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
