<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 400px;">
<h2 class="text-center mb-4">Đăng nhập</h2>
<div th:if="${param.error}" class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu!</div>
<div th:if="${param.logout}" class="alert alert-success">Đăng xuất thành công!</div>

<form th:action="@{/login}" method="post">
    <div class="mb-3">
        <label class="form-label">Tên đăng nhập:</label>
        <input type="text" name="username" class="form-control" required autofocus />
    </div>
    <div class="mb-3">
        <label class="form-label">Mật khẩu:</label>
        <input type="password" name="password" class="form-control" required />
    </div>
    <button type="submit" class="w-100 btn btn-primary">Đăng nhập</button>
</form>
</body>
</html>
